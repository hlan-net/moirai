# Production dependencies for Docker builds.
# This is environment.yml minus dev/test tooling (pytest, black, ruff, etc.).
# Keep in sync with environment.yml when adding new runtime dependencies.
# All pip packages are pinned to exact versions for reproducible builds.
# Dependabot will propose PRs to bump these versions.
name: moirai
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    - flask==3.1.3
    - feedparser==6.0.12
    - requests==2.32.5
    - flask-wtf==1.2.2
    - schedule==1.2.2
    - beautifulsoup4==4.14.3
    - python-dateutil==2.9.0.post0
    - mcp[cli]==1.26.0
    - httpx[http2]==0.28.1
    - openai==2.29.0
    - uvicorn==0.42.0
    - flask-limiter==4.1.1
    - prometheus-flask-exporter==0.23.2
    - pydantic==2.12.5
    - validators==0.35.0
    - bleach==6.3.0
    - starlette==1.0.0
    - starlette-prometheus==0.10.0
    - prometheus_client==0.24.1
    - google-genai==1.7.0
    - websockets==15.0.1
    - google-auth==2.49.1
    - opentelemetry-api==1.40.0
    - opentelemetry-sdk==1.40.0
    - opentelemetry-exporter-otlp==1.40.0
    - opentelemetry-instrumentation-fastapi==0.61b0
    - opentelemetry-instrumentation-flask==0.61b0
    - opentelemetry-instrumentation-requests==0.61b0
    - structlog==25.5.0
    - tenacity==9.1.4
    - PyJWT==2.12.1
    - passlib==1.7.4
    - bcrypt==5.0.0
    - google-auth-oauthlib==1.3.0
    - msal==1.35.1
    - cryptography==46.0.5
    - langdetect==1.0.9
    - redis==7.4.0
    - gunicorn==25.2.0
    - atproto==0.0.65
