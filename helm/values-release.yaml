# Release/production environment overrides
# Deploy with: helm install moirai . -f values-release.yaml -n moirai-release

environment: production

api:
  replicaCount: 2  # Higher availability in production
  image:
    tag: "latest"  # Or pin to specific version like "0.6.1"
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30

ui:
  replicaCount: 1
  image:
    tag: "latest"  # Or pin to specific version like "0.6.1"

# Bump worker and scheduler memory: at 512Mi feed-fetch load (~63 feeds / 10 min)
# can exceed the container limit.
worker:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: "1Gi"
    limits:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: "2Gi"

scheduler:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: "1Gi"
    limits:
      cpu: 500m
      memory: 1Gi
      ephemeral-storage: "2Gi"
