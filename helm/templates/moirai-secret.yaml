{{- if or .Values.moirai.adminUsername .Values.moirai.adminPassword .Values.moirai.jwtSecretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-moirai-secret
  labels:
    app.kubernetes.io/name: {{ include "moirai.name" . }}
    helm.sh/chart: {{ include "moirai.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  adminUsername: {{ .Values.moirai.adminUsername | b64enc | quote }}
  adminPassword: {{ .Values.moirai.adminPassword | b64enc | quote }}
  {{- if .Values.moirai.jwtSecretKey }}
  jwtSecretKey: {{ .Values.moirai.jwtSecretKey | b64enc | quote }}
  {{- end }}
{{- end }}
