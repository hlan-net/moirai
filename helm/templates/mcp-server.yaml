{{- if .Values.mcpServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moirai.fullname" . }}-mcp-server
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "moirai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      annotations:
        checksum/couchdb-secret: {{ include (print $.Template.BasePath "/couchdb-secret.yaml") . | sha256sum }}
        checksum/moirai-secret: {{ include (print $.Template.BasePath "/moirai-secret.yaml") . | sha256sum }}
      labels:
        {{- include "moirai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-server

    spec:
      serviceAccountName: {{ include "moirai.serviceAccountName" . }}
      containers:
        - name: {{ include "moirai.name" . }}-mcp-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.mcpServer.command }}
          command:
{{ toYaml . | indent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.mcpServer.service.targetPort }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mcpServer.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.mcpServer.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: OLLAMA_ENDPOINT
              value: {{ .Values.ollama.endpoint | quote }}
            - name: OPEN_WEBUI_ENDPOINT
              value: {{ .Values.openWebui.endpoint | quote }}
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-couchdb
                  key: adminUsername
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-couchdb
                  key: adminPassword
            - name: COUCHDB_URI
              value: "http://$(MOIRAI_SVC_COUCHDB_SERVICE_HOST):5984/"
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-moirai-secret
                  key: apiUsername
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-moirai-secret
                  key: apiPassword
            - name: COUCHDB_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-couchdb
                  key: cookieAuthSecret
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moirai.fullname" . }}-mcp-server
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  type: {{ .Values.mcpServer.service.type }}
  selector:
    {{- include "moirai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
  ports:
    - protocol: TCP
      name: http
      port: {{ .Values.mcpServer.service.port }}
      targetPort: {{ .Values.mcpServer.service.targetPort }}
    - protocol: TCP
      name: metrics
      port: {{ .Values.mcpServer.service.metricsPort }}
      targetPort: {{ .Values.mcpServer.service.metricsTargetPort }}
---
{{- if .Values.prometheus.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "moirai.fullname" . }}-mcp-server
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
    {{- with .Values.prometheus.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "moirai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-server
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.prometheus.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.prometheus.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- end }}
