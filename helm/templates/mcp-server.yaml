{{- if .Values.mcpServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moirai.fullname" . }}-mcp-server
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "moirai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      annotations:
        checksum/couchdb-secret: {{ include (print $.Template.BasePath "/couchdb-secret.yaml") . | sha256sum }}
        checksum/moirai-secret: {{ include (print $.Template.BasePath "/moirai-secret.yaml") . | sha256sum }}
      labels:
        {{- include "moirai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-server

    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "moirai.serviceAccountName" . }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "moirai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: mcp-server
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - api
                        - worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: {{ include "moirai.name" . }}-mcp-server
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ if eq .Values.api.image.tag "latest" }}Always{{ else }}{{ default "IfNotPresent" .Values.api.image.pullPolicy }}{{ end }}
          {{- with .Values.mcpServer.command }}
          command:
{{ toYaml . | indent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.mcpServer.service.targetPort }}
            - name: metrics
              containerPort: {{ .Values.mcpServer.service.metricsTargetPort }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mcpServer.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.mcpServer.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: "1Gi"
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: "2Gi"
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: METRICS_PORT
              value: {{ .Values.mcpServer.service.metricsTargetPort | quote }}
            - name: OLLAMA_BASE_URL
              value: {{ .Values.ollama.endpoint | quote }}
            - name: OPEN_WEBUI_ENDPOINT
              value: {{ .Values.openWebui.endpoint | quote }}
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-couchdb
                  key: adminUsername
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-couchdb
                  key: adminPassword
            - name: COUCHDB_URI
              value: "http://{{ include "moirai.fullname" . }}-couchdb:5984/"
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "moirai.fullname" . }}-moirai-secret
                  key: adminUsername
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "moirai.fullname" . }}-moirai-secret
                  key: adminPassword
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "moirai.fullname" . }}-moirai-secret
                  key: jwtSecretKey
                  optional: true
            - name: COUCHDB_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-couchdb
                  key: cookieAuthSecret
            {{- if .Values.redis.enabled }}
            - name: REDIS_HOST
              value: "{{ include "moirai.fullname" . }}-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "moirai.fullname" . }}-redis-secret
                  key: password
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moirai.fullname" . }}-mcp-server
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  type: {{ .Values.mcpServer.service.type }}
  selector:
    {{- include "moirai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
  ports:
    - protocol: TCP
      name: http
      port: {{ .Values.mcpServer.service.port }}
      targetPort: {{ .Values.mcpServer.service.targetPort }}
    - protocol: TCP
      name: metrics
      port: {{ .Values.mcpServer.service.metricsPort }}
      targetPort: {{ .Values.mcpServer.service.metricsTargetPort }}
---
{{- if .Values.prometheus.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "moirai.fullname" . }}-mcp-server
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
    {{- with .Values.prometheus.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "moirai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-server
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.prometheus.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.prometheus.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- end }}
