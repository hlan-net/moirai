apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moirai.fullname" . }}-ui
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "moirai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "moirai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "moirai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: ui
      containers:
        - name: {{ include "moirai.name" . }}-ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ if eq .Values.ui.image.tag "latest" }}Always{{ else }}{{ default "IfNotPresent" .Values.ui.image.pullPolicy }}{{ end }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.service.port }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: "100Mi"
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: "200Mi"
