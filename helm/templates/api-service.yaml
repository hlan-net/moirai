apiVersion: v1
kind: Service
metadata:
  name: {{ include "moirai.fullname" . }}-api
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "moirai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - protocol: TCP
      name: http
      port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
