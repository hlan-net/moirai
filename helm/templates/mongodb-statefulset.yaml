apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-{{ .Values.mongodb.name }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.mongodb.name }}
spec:
  serviceName: {{ .Release.Name }}-{{ .Values.mongodb.name }}-headless
  replicas: {{ .Values.mongodb.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.mongodb.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.mongodb.name }}
    spec:
      containers:
        - name: {{ .Release.Name }}-mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          ports:
            - containerPort: {{ .Values.mongodb.port }}
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
      volumes:
        - name: mongodb-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mongodb-pvc
