apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-{{ .Values.service.name }}
  labels:
    {{- include "common.labels" . | nindent 4 }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.service.name }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.app.name }}
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: moirai
spec:
  selector:
    app: {{ .Release.Name }}-{{ .Values.app.name }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}