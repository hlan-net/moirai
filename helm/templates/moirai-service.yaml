apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "moirai.serviceAccountName" . }}
  labels:
    {{- include "moirai.labels" . | nindent 4 }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "moirai.fullname" . }}
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "moirai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}