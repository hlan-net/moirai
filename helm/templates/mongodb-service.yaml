apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.mongodb.name }}-headless
  labels:
    app: {{ .Release.Name }}-{{ .Values.mongodb.name }}
spec:
  ports:
    - port: {{ .Values.mongodb.port }}
      targetPort: {{ .Values.mongodb.port }}
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-{{ .Values.mongodb.name }}