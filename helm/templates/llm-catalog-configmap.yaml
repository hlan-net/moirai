{{- if include "moirai.llmCatalogEnabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moirai.fullname" . }}-llm-catalog
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
data:
  catalog.json: |
    {{- dict "catalog" .Values.llm.catalog "purposes" (.Values.llm.purposes | default dict) | toPrettyJson | nindent 4 }}
{{- end }}
