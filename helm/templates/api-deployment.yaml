apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moirai.fullname" . }}-api
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "moirai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/couchdb-secret: {{ include (print $.Template.BasePath "/couchdb-secret.yaml") . | sha256sum }}
        checksum/moirai-secret: {{ include (print $.Template.BasePath "/moirai-secret.yaml") . | sha256sum }}
        checksum/openai-secret: {{ include (print $.Template.BasePath "/openai-secret.yaml") . | sha256sum }}
        checksum/gemini-secret: {{ include (print $.Template.BasePath "/gemini-secret.yaml") . | sha256sum }}
        checksum/feed-configmap: {{ include (print $.Template.BasePath "/feed-list-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "moirai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "moirai.serviceAccountName" . }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "moirai.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - mcp-server
                        - worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: {{ include "moirai.name" . }}-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ if eq .Values.api.image.tag "latest" }}Always{{ else }}{{ default "IfNotPresent" .Values.api.image.pullPolicy }}{{ end }}
          {{- with .Values.api.command }}
          command:
{{ toYaml . | indent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold | default 5 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds | default 20 }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold | default 5 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          env:
          - name: ENVIRONMENT
            value: {{ .Values.environment | quote }}
          - name: OLLAMA_BASE_URL
            value: {{ .Values.ollama.endpoint | quote }}
          - name: OPEN_WEBUI_ENDPOINT
            value: {{ .Values.openWebui.endpoint | quote }}
          - name: COUCHDB_USER
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-couchdb
                key: adminUsername
          - name: COUCHDB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-couchdb
                key: adminPassword
          - name: COUCHDB_URI
            value: "http://{{ include "moirai.fullname" . }}-couchdb:5984/"
          - name: HTTP_PORT
            value: {{ .Values.api.service.port | quote }}
          - name: ALLOW_PUBLIC_READ
            value: "false"
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-openai-secret
                key: apiKey
          - name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-gemini-secret
                key: apiKey
          - name: ADMIN_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ include "moirai.fullname" . }}-moirai-secret
                key: adminUsername
          - name: ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "moirai.fullname" . }}-moirai-secret
                key: adminPassword
          - name: JWT_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: {{ include "moirai.fullname" . }}-moirai-secret
                key: jwtSecretKey
                optional: true
          - name: COUCHDB_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-couchdb
                key: cookieAuthSecret
          - name: ENABLE_PROD_STARTUP
            value: {{ .Values.api.enableProdStartup | quote }}
          - name: MCP_SERVER_URL
            value: "http://{{ include "moirai.fullname" . }}-mcp-server:{{ .Values.mcpServer.service.port }}/sse"
          - name: ARTICLE_EXPIRATION_DAYS
            value: {{ .Values.api.articleExpirationDays | quote }}
          {{- if .Values.redis.enabled }}
          - name: REDIS_HOST
            value: "{{ include "moirai.fullname" . }}-redis"
          - name: REDIS_PORT
            value: "6379"
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "moirai.fullname" . }}-redis-secret
                key: password
          {{- end }}
          volumeMounts:
            - name: feeds-volume
              mountPath: /app/feeds
      volumes:
        - name: feeds-volume
          configMap:
            name: {{ include "moirai.fullname" . }}-feed-lists
