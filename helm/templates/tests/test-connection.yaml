# templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "moirai.fullname" . }}-test-connection"
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
    "helm.sh/hook-weight": "0"
spec:
  initContainers:
    - name: wait-for-service
      image: busybox
      command: ['sh', '-c', 'until nc -z -v -w30 {{ include "moirai.fullname" . }}-nginx {{ .Values.nginx.service.port }}; do echo "Waiting for service..."; sleep 5; done']
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "moirai.fullname" . }}-nginx:{{ .Values.nginx.service.port }}']
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
  restartPolicy: Never
