apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-{{ .Values.couchdb.name }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.couchdb.name }}
spec:
  serviceName: {{ .Release.Name }}-{{ .Values.couchdb.name }}-headless
  replicas: {{ .Values.couchdb.replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.couchdb.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.couchdb.name }}
    spec:
      initContainers:
        - name: init-couchdb
          image: busybox
          command: ['sh', '-c', 'echo "Initializing CouchDB"']
          volumeMounts:
            - name: couchdb-data
              mountPath: /opt/couchdb/data
      containers:
        - name: {{ .Release.Name }}-couchdb
          image: "{{ .Values.couchdb.image.repository }}:{{ .Values.couchdb.image.tag }}"
          imagePullPolicy: {{ .Values.couchdb.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: COUCHDB_USER
              value: "{{ .Values.couchdb.adminUser }}"
            - name: COUCHDB_PASSWORD
              value: "{{ .Values.couchdb.adminPassword }}"
          ports:
            - containerPort: {{ .Values.couchdb.port }}
              name: couchdb
          volumeMounts:
            - name: couchdb-data
              mountPath: /opt/couchdb/data
      volumes:
        - name: couchdb-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-couchdb-pvc
