apiVersion: v1
kind: Service
metadata:
  name: {{ include "moirai.fullname" . }}-ui
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "moirai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
  ports:
    - protocol: TCP
      name: http
      port: {{ .Values.ui.service.port }}
      targetPort: {{ .Values.ui.service.targetPort }}
