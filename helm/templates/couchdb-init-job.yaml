apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-couchdb-init
  labels:
    app: {{ .Release.Name }}-{{ .Values.couchdb.name }}
    {{- include "common.labels" . | nindent 4 }}
    app.kubernetes.io/component: couchdb-init
spec:
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.couchdb.name }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: couchdb-init
          image: curlimages/curl:latest
          env:
            - name: COUCHDB_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-couchdb-secret
                  key: admin-username
            - name: COUCHDB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-couchdb-secret
                  key: admin-password
            - name: COUCHDB_APPLICATION_USER
              valueFrom:
                secretKeyRef:
                    name: {{ .Release.Name }}-couchdb-secret
                    key: application-username
            - name: COUCHDB_APPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-couchdb-secret
                  key: application-password
          command:
            - sh
            - -c
            - |
              echo "$(date) Waiting for CouchDB to become available..."
              until curl --fail -s -u "$COUCHDB_ADMIN_USER:$COUCHDB_ADMIN_PASSWORD" http://{{ .Release.Name }}-{{ .Values.couchdb.name }}-0.{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.couchdb.port }}/_up; do
                echo "$(date) CouchDB not yet available, sleeping..."
                sleep 5
              done
              {{- if gt (int .Values.couchdb.replicas) 1 }}
              echo "$(date) Setting up CouchDB cluster..."
              curl -X POST -u "$COUCHDB_ADMIN_USER:$COUCHDB_ADMIN_PASSWORD" \
                http://{{ .Release.Name }}-{{ .Values.couchdb.name }}-0.{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.couchdb.port }}/_cluster_setup \
                -H "Content-Type: application/json" \
                -d '{
                      "action": "enable_cluster",
                      "bind_address": "0.0.0.0",
                      "node_count": {{ .Values.couchdb.replicas }}
                    }'
              {{- end }}
              echo "$(date) Checking if _users database exists..."
              if ! curl -s -u "$COUCHDB_ADMIN_USER:$COUCHDB_ADMIN_PASSWORD" http://{{ .Release.Name }}-{{ .Values.couchdb.name }}-0.{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.couchdb.port }}/_users; then
                echo "$(date) Creating _users database..."
                curl -X PUT -u "$COUCHDB_ADMIN_USER:$COUCHDB_ADMIN_PASSWORD" http://{{ .Release.Name }}-{{ .Values.couchdb.name }}-0.{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.couchdb.port }}/_users
              else
                echo "$(date) _users database already exists."
              fi
              echo "$(date) Checking if moirai CouchDB user exists..."
              if ! curl -s -u "$COUCHDB_ADMIN_USER:$COUCHDB_ADMIN_PASSWORD" http://{{ .Release.Name }}-{{ .Values.couchdb.name }}-0.{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.couchdb.port }}/_users/org.couchdb.user:{{ .Values.couchdb.applicationUser }}; then
                echo "$(date) Creating moirai CouchDB user..."
                curl -X PUT -u "$COUCHDB_ADMIN_USER:$COUCHDB_ADMIN_PASSWORD" \
                  http://{{ .Release.Name }}-{{ .Values.couchdb.name }}-0.{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.couchdb.port }}/_users/org.couchdb.user:{{ .Values.couchdb.applicationUser }} \
                  -H "Content-Type: application/json" \
                  -d '{
                        "name": "{{ .Values.couchdb.applicationUser }}",
                        "password": "$COUCHDB_APPLICATION_PASSWORD",
                        "roles": ["{{ .Values.app.name }}-user"],
                        "type": "user"
                      }'
              else
                echo "$(date) moirai CouchDB user already exists."
              fi
              {{- range .Values.couchdb.databases }}
              echo "$(date) Checking if {{ . }} database exists..."
              if ! curl -s -u "$COUCHDB_ADMIN_USER:$COUCHDB_ADMIN_PASSWORD" http://{{ $.Release.Name }}-{{ $.Values.couchdb.name }}-0.{{ $.Release.Name }}-{{ $.Values.couchdb.name }}-headless.{{ $.Release.Namespace }}.svc.cluster.local:{{ $.Values.couchdb.port }}/{{ . }}; then
                echo "$(date) Creating {{ . }} database..."
                curl -X PUT -u "$COUCHDB_ADMIN_USER:$COUCHDB_ADMIN_PASSWORD" http://{{ $.Release.Name }}-{{ $.Values.couchdb.name }}-0.{{ $.Release.Name }}-{{ $.Values.couchdb.name }}-headless.{{ $.Release.Namespace }}.svc.cluster.local:{{ $.Values.couchdb.port }}/{{ . }}
              else
                echo "$(date) {{ . }} database already exists."
              fi
              echo "$(date) Setting permissions for {{ $.Values.couchdb.applicationUser }} on {{ . }}..."
              curl -X PUT -u "$COUCHDB_ADMIN_USER:$COUCHDB_ADMIN_PASSWORD" http://{{ $.Release.Name }}-{{ $.Values.couchdb.name }}-0.{{ $.Release.Name }}-{{ $.Values.couchdb.name }}-headless.{{ $.Release.Namespace }}.svc.cluster.local:{{ $.Values.couchdb.port }}/{{ . }}/_security \
                -H "Content-Type: application/json" \
                -d '{
                      "admins": {
                        "names": ["{{ $.Values.couchdb.adminUser }}"],
                        "roles": []
                      },
                      "members": {
                        "names": ["{{ $.Values.couchdb.applicationUser }}"],
                        "roles": []
                      }
                    }'
              {{- end }}
              echo "$(date) Initialization script completed."
              echo "$(date) --- Summary ---"
              echo "$(date) Checking _users database..."
              if curl -s -u "$COUCHDB_ADMIN_USER:$COUCHDB_ADMIN_PASSWORD" http://{{ .Release.Name }}-{{ .Values.couchdb.name }}-0.{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.couchdb.port }}/_users; then
                echo "$(date) _users database exists."
              else
                echo "$(date) _users database does not exist."
              fi
              echo "$(date) Checking moirai CouchDB user..."
              if curl -s -u "$COUCHDB_ADMIN_USER:$COUCHDB_ADMIN_PASSWORD" http://{{ .Release.Name }}-{{ .Values.couchdb.name }}-0.{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.couchdb.port }}/_users/org.couchdb.user:{{ .Values.couchdb.applicationUser }}; then
                echo "$(date) moirai CouchDB user exists."
              else
                echo "$(date) moirai CouchDB user does not exist."
              fi
              {{- range .Values.couchdb.databases }}
              echo "$(date) Checking {{ . }} database..."
              if curl -s -u "$COUCHDB_ADMIN_USER:$COUCHDB_ADMIN_PASSWORD" http://{{ $.Release.Name }}-{{ $.Values.couchdb.name }}-0.{{ $.Release.Name }}-{{ $.Values.couchdb.name }}-headless.{{ $.Release.Namespace }}.svc.cluster.local:{{ $.Values.couchdb.port }}/{{ . }}; then
                echo "$(date) {{ . }} database exists."
              else
                echo "$(date) {{ . }} database does not exist."
              fi
              {{- end }}
              echo "$(date) --- End Summary ---"