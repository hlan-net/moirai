apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moirai.fullname" . }}
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "moirai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      annotations:
        checksum/couchdb-secret: {{ include (print $.Template.BasePath "/couchdb-secret.yaml") . | sha256sum }}
        checksum/moirai-secret: {{ include (print $.Template.BasePath "/moirai-secret.yaml") . | sha256sum }}
        checksum/openai-secret: {{ include (print $.Template.BasePath "/openai-secret.yaml") . | sha256sum }}
        checksum/feed-configmap: {{ include (print $.Template.BasePath "/feed-list-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "moirai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app

    spec:
      serviceAccountName: {{ include "moirai.serviceAccountName" . }}
      {{- if .Values.securityContext }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}
      initContainers:
        - name: couchdb-init
          image: curlimages/curl:latest
          env:
          - name: ENVIRONMENT
            value: {{ .Values.environment | quote }}
          - name: OLLAMA_ENDPOINT
            value: {{ .Values.ollama.endpoint | quote }}
          - name: OPEN_WEBUI_ENDPOINT
            value: {{ .Values.openWebui.endpoint | quote }}
          - name: COUCHDB_USER
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-couchdb
                key: adminUsername
          - name: COUCHDB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-couchdb
                key: adminPassword
          - name: COUCHDB_URI
            value: "http://$(MOIRAI_SVC_COUCHDB_SERVICE_HOST):5984/"
          - name: HTTP_PORT
            value: {{ .Values.service.targetPort | quote }}
          
          command:
            - sh
            - -c
            - |
              # Function to check if CouchDB is ready
              check_couchdb_ready() {
                until curl -s -o /dev/null -w "%{http_code}" http://$MOIRAI_SVC_COUCHDB_SERVICE_HOST:5984 | grep -q "200"; do
                  echo "CouchDB not yet ready, waiting..."
                  sleep 5
                done
                echo "CouchDB is ready!"
              }

              # Function to create a database if it doesn't exist
              create_database() {
                db_name=$1
                if ! curl -s -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://$MOIRAI_SVC_COUCHDB_SERVICE_HOST:5984/$db_name | grep -q '"error":"not_found"'; then
                  echo "Database '$db_name' already exists."
                else
                  echo "Creating database '$db_name'..."
                  until curl -X PUT -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://$MOIRAI_SVC_COUCHDB_SERVICE_HOST:5984/$db_name; do
                    echo "Failed to create database '$db_name', retrying..."
                    sleep 5
                  done
                  echo "Database '$db_name' created successfully."
                fi
              }
              
              # Function to create a Mango index
              create_index() {
                db_name=$1
                index_json=$2
                echo "Creating index for '$db_name'..."
                curl -X POST -u "$COUCHDB_USER:$COUCHDB_PASSWORD" \
                  -H "Content-Type: application/json" \
                  -d "$index_json" \
                  http://$MOIRAI_SVC_COUCHDB_SERVICE_HOST:5984/$db_name/_index
              }

              # Check CouchDB readiness
              check_couchdb_ready

              # Create required databases
              create_database "_users"
              create_database "feeds"
              create_database "articles"
              create_database "events"
              create_database "trends"

              # Create indexes
              create_index "articles" '{"index": {"fields": ["published"]}, "name": "published-index", "type": "json"}'
              create_index "events" '{"index": {"fields": ["article_links"]}, "name": "events-links-index", "type": "json"}'
              create_index "trends" '{"index": {"fields": ["event_ids"]}, "name": "trends-events-index", "type": "json"}'

              # Get cluster status
              echo "Fetching CouchDB cluster status..."
              cluster_status=$(curl -s -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://$MOIRAI_SVC_COUCHDB_SERVICE_HOST:5984/_membership)
              echo "CouchDB Cluster Status: $cluster_status"
      containers:
        - name: {{ include "moirai.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.moirai.command }}
          command:
{{ toYaml . | indent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
            - name: metrics
              containerPort: {{ .Values.service.metricsTargetPort }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
          - name: ENVIRONMENT
            value: {{ .Values.environment | quote }}
          - name: OLLAMA_ENDPOINT
            value: {{ .Values.ollama.endpoint | quote }}
          - name: OPEN_WEBUI_ENDPOINT
            value: {{ .Values.openWebui.endpoint | quote }}
          - name: COUCHDB_USER
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-couchdb
                key: adminUsername
          - name: COUCHDB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-couchdb
                key: adminPassword
          - name: COUCHDB_URI
            value: "http://$(MOIRAI_SVC_COUCHDB_SERVICE_HOST):5984/"
          - name: HTTP_PORT
            value: {{ .Values.service.targetPort | quote }}
          - name: ALLOW_PUBLIC_READ
            value: {{ .Values.allowPublicRead | quote }}
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-openai-secret
                key: apiKey
          - name: API_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ include "moirai.fullname" . }}-moirai-secret
                key: apiUsername
          - name: API_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "moirai.fullname" . }}-moirai-secret
                key: apiPassword
          - name: COUCHDB_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-couchdb
                key: cookieAuthSecret
          - name: ENABLE_PROD_STARTUP
            value: {{ .Values.moirai.enableProdStartup | quote }}
          - name: MCP_SERVER_URL
            value: "http://{{ include "moirai.fullname" . }}-mcp-server:{{ .Values.mcpServer.service.port }}/sse"
          - name: ARTICLE_EXPIRATION_DAYS
            value: {{ .Values.moirai.articleExpirationDays | quote }}
          volumeMounts:
            - name: feeds-volume
              mountPath: /app/feeds
      volumes:
        - name: feeds-volume
          configMap:
            name: {{ include "moirai.fullname" . }}-feed-lists
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moirai.fullname" . }}
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "moirai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - protocol: TCP
      name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
    - protocol: TCP
      name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: {{ .Values.service.metricsTargetPort }}
---
{{- if .Values.prometheus.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "moirai.fullname" . }}
  labels:
    {{- include "moirai.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
    {{- with .Values.prometheus.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "moirai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.prometheus.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.prometheus.serviceMonitor.scrapeTimeout }}
{{- end }}
