apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-{{ .Values.deployment.name }}"
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-{{ .Values.app.name }}"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-{{ .Values.app.name }}"
        {{- include "common.labels" . | nindent 8 }}
        app.kubernetes.io/component: moirai
    spec:
      serviceAccountName: {{ .Release.Name }}-{{ .Values.service.name }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      env:
        - name: ENVIRONMENT
          value: {{ .Values.environment | quote }}
        - name: OLLAMA_ENDPOINT
          value: {{ .Values.ollama.endpoint | quote }}
        - name: OPEN_WEBUI_ENDPOINT
          value: {{ .Values.openWebui.endpoint | quote }}
        - name: COUCHDB_USER
          value: {{- $secret := lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .) -}}
          {{- if $secret }}
            {{- default .Values.couchdb.adminUsername ($secret.data.adminUsername | b64dec) }}
          {{- else }}
            {{ .Values.couchdb.adminUsername | default "admin" }}
          {{- end }}
        - name: COUCHDB_PASSWORD
          value: {{- $secret := lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .) -}}
          {{- if $secret }}
            {{- default .Values.couchdb.adminPassword ($secret.data.adminPassword | b64dec) }}
          {{- else }}
            {{ .Values.couchdb.adminPassword | default "your-password" }}
          {{- end }}
        - name: COUCHDB_URI
          value: "http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless:5984/"
        - name: HTTP_PORT
          value: {{ .Values.service.targetPort | quote }}
          
      initContainers:
        - name: couchdb-init
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              # Function to check if CouchDB is ready
              check_couchdb_ready() {
                until curl -s -o /dev/null -w "%{http_code}" http://{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless:5984 | grep -q "200"; do
                  echo "CouchDB not yet ready, waiting..."
                  sleep 5
                done
                echo "CouchDB is ready!"
              }

              # Function to create a database if it doesn't exist
              create_database() {
                db_name=$1
                if ! curl -s http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless:5984/$db_name | grep -q '"error":"not_found"'; then
                  echo "Database '$db_name' already exists."
                else
                  echo "Creating database '$db_name'..."
                  until curl -X PUT http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless:5984/$db_name; do
                    echo "Failed to create database '$db_name', retrying..."
                    sleep 5
                  done
                  echo "Database '$db_name' created successfully."
                fi
              }

              # Check CouchDB readiness
              check_couchdb_ready

              # Create required databases
              create_database "_users"
              create_database "feeds"
              create_database "articles"
              create_database "events"

              # Get cluster status
              echo "Fetching CouchDB cluster status..."
              cluster_status=$(curl -s http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless:5984/_membership)
              echo "CouchDB Cluster Status: $cluster_status"
      containers:
        - name: "{{ .Release.Name }}-{{ .Values.app.name }}"
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          volumeMounts:
            - name: feeds-volume
              mountPath: /app/feeds
      volumes:
        - name: feeds-volume
          configMap:
            name: feed-lists
