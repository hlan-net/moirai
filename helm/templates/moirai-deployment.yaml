apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-{{ .Values.deployment.name }}"
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-{{ .Values.app.name }}"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-{{ .Values.app.name }}"
        {{- include "common.labels" . | nindent 8 }}
        app.kubernetes.io/component: moirai
    spec:
      containers:
        - name: "{{ .Release.Name }}-{{ .Values.app.name }}"
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: OLLAMA_ENDPOINT
              value: {{ .Values.ollama.endpoint | quote }}
            - name: OPEN_WEBUI_ENDPOINT
              value: {{ .Values.openWebui.endpoint | quote }}
            - name: COUCHDB_USER
              value: "{{- if (lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .) ) -}}
                {{- ternary ( (lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .) ).data.adminUsername | b64dec ) .Values.couchdb.adminUsername "admin" }}
              {{- else -}}
                {{ .Values.couchdb.adminUsername | default "admin" }}
              {{- end }}"
            - name: COUCHDB_PASSWORD
              value: "{{- if (lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .) ) -}}
                {{- ternary ( (lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .) ).data.adminPassword | b64dec ) .Values.couchdb.adminPassword "your-password" }}
              {{- else -}}
                {{ .Values.couchdb.adminPassword | default "your-password" }}
              {{- end }}"
            - name: COUCHDB_URI
              value: "http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless:5984/"
            - name: HTTP_PORT
              value: {{ .Values.service.targetPort | quote }}
          volumeMounts:
            - name: feeds-volume
              mountPath: /app/feeds
      volumes:
        - name: feeds-volume
          configMap:
            name: feed-lists
