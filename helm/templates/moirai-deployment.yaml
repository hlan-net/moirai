apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-{{ .Values.deployment.name }}"
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-{{ .Values.app.name }}"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-{{ .Values.app.name }}"
        {{- include "common.labels" . | nindent 8 }}
        app.kubernetes.io/component: moirai
    spec:
      serviceAccountName: {{ .Release.Name }}-{{ .Values.service.name }}
      {{- if .Values.securityContext }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- end }}
      initContainers:
        - name: couchdb-init
          image: curlimages/curl:latest
          env:
          - name: ENVIRONMENT
            value: {{ .Values.environment | quote }}
          - name: OLLAMA_ENDPOINT
            value: {{ .Values.ollama.endpoint | quote }}
          - name: OPEN_WEBUI_ENDPOINT
            value: {{ .Values.openWebui.endpoint | quote }}
          - name: COUCHDB_USER
            value: "{{- if (lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .)) -}}{{ default .Values.couchdb.adminUsername ((lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .)).data.adminUsername | b64dec) -}}{{- else -}}{{ .Values.couchdb.adminUsername | default "admin" -}}{{- end }}"
          - name: COUCHDB_PASSWORD
            value: "{{- if (lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .)) -}}{{ default .Values.couchdb.adminPassword ((lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .)).data.adminPassword | b64dec) -}}{{- else -}}{{ .Values.couchdb.adminPassword | default "adminPass" -}}{{- end }}"
          - name: COUCHDB_URI
            value: "http://$(COUCHDB_USER):$(COUCHDB_PASSWORD)@{{ .Release.Name }}-{{ .Values.couchdb.name }}-headless:5984/"
          - name: HTTP_PORT
            value: {{ .Values.service.targetPort | quote }}
          
          command:
            - sh
            - -c
            - |
              # Function to check if CouchDB is ready
              check_couchdb_ready() {
                until curl -s -o /dev/null -w "%{http_code}" http://$MOIRAI_SVC_COUCHDB_SERVICE_HOST:5984 | grep -q "200"; do
                  echo "CouchDB not yet ready, waiting..."
                  sleep 5
                done
                echo "CouchDB is ready!"
              }

              # Function to create a database if it doesn't exist
              create_database() {
                db_name=$1
                if ! curl -s -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://$MOIRAI_SVC_COUCHDB_SERVICE_HOST:5984/$db_name | grep -q '"error":"not_found"'; then
                  echo "Database '$db_name' already exists."
                else
                  echo "Creating database '$db_name'..."
                  until curl -X PUT -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://$MOIRAI_SVC_COUCHDB_SERVICE_HOST:5984/$db_name; do
                    echo "Failed to create database '$db_name', retrying..."
                    sleep 5
                  done
                  echo "Database '$db_name' created successfully."
                fi
              }

              # Check CouchDB readiness
              check_couchdb_ready

              # Create required databases
              create_database "_users"
              create_database "feeds"
              create_database "articles"
              create_database "events"

              # Get cluster status
              echo "Fetching CouchDB cluster status..."
              cluster_status=$(curl -s -u "$COUCHDB_USER:$COUCHDB_PASSWORD" http://$MOIRAI_SVC_COUCHDB_SERVICE_HOST:5984/_membership)
              echo "CouchDB Cluster Status: $cluster_status"
      containers:
        - name: "{{ .Release.Name }}-{{ .Values.app.name }}"
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
          - name: ENVIRONMENT
            value: {{ .Values.environment | quote }}
          - name: OLLAMA_ENDPOINT
            value: {{ .Values.ollama.endpoint | quote }}
          - name: OPEN_WEBUI_ENDPOINT
            value: {{ .Values.openWebui.endpoint | quote }}
          - name: COUCHDB_USER
            value: "{{- if (lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .)) -}}{{ default .Values.couchdb.adminUsername ((lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .)).data.adminUsername | b64dec) -}}{{- else -}}{{ .Values.couchdb.adminUsername | default "admin" -}}{{- end }}"
          - name: COUCHDB_PASSWORD
            value: "{{- if (lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .)) -}}{{ default .Values.couchdb.adminPassword ((lookup "v1" "Secret" .Release.Namespace (include "moirai.couchdbSecretName" .)).data.adminPassword | b64dec) -}}{{- else -}}{{ .Values.couchdb.adminPassword | default "adminPass" -}}{{- end }}"
          - name: COUCHDB_URI
            value: "http://$COUCHDB_USER:$COUCHDB_PASSWORD@$MOIRAI_SVC_COUCHDB_SERVICE_HOST:5984/"
          - name: HTTP_PORT
            value: {{ .Values.service.targetPort | quote }}
          - name: ALLOW_PUBLIC_READ
            value: {{ .Values.allowPublicRead | quote }}
          - name: OPENAI_API_KEY
            value: {{ .Values.openai.apiKey | quote }}
          - name: API_USERNAME
            value: {{ .Values.moirai.apiUsername | quote }}
          - name: API_PASSWORD
            value: {{ .Values.moirai.apiPassword | quote }}
          - name: COUCHDB_SECRET
            value: {{ .Values.couchdb.cookieAuthSecret | quote }}
          volumeMounts:
            - name: feeds-volume
              mountPath: /app/feeds
      volumes:
        - name: feeds-volume
          configMap:
            name: feed-lists
