
{{/* filepath: /home/larry/slorba/moirai/helm/templates/couchdb-secrets.yaml */}}
{{- define "couchdb-secrets" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-couchdb-secrets
type: Opaque
data:
  adminUsername: {{ .Values.couchdb.adminUsername | b64enc | quote }}
  adminPassword: {{ .Values.couchdb.adminPassword | b64enc | quote }}
  cookieAuthSecret: {{ .Values.couchdb.cookieAuthSecret | b64enc | quote }}
{{- end -}}
