# Default values for GenAI Press Review service

replicaCount: 1 # This can be overridden per-service if needed

api:
  replicaCount: 2
  image:
    repository: ghcr.io/hlan-net/moirai
    tag: "0.5.2-dev"
    pullPolicy: IfNotPresent
  # Use image default command (gunicorn) when empty
  command: []
  service:
    type: ClusterIP
    port: 8088
    targetPort: 8088
  enableProdStartup: "true"
  articleExpirationDays: 30
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: "1Gi"
    limits:
      cpu: 500m
      memory: 512Mi
      ephemeral-storage: "2Gi"
  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 6
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5

ui:
  replicaCount: 1
  image:
    repository: ghcr.io/hlan-net/moirai-ui
    tag: "0.5.2-dev"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

nginx:
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.25-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP # Or LoadBalancer/NodePort if you want to expose it directly
    port: 80
    targetPort: 80
  ingress:
    enabled: true
    host: moirai.example.com
    annotations: {}
    tls: []

mcpServer:
  enabled: true
  command:
    - /bin/sh
    - -c
    - "/app/create_dbs.sh && uvicorn mcp_service.main:app --host 0.0.0.0 --port 8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
    metricsPort: 9000
    metricsTargetPort: 9000

mcpInspector:
  enabled: false
  image:
    repository: ghcr.io/modelcontextprotocol/inspector
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6274

scheduler:
  # -- Cron schedule for the feed-fetch scheduler job (default: every 10 minutes)
  schedule: "*/10 * * * *"

# -- Environment to run the application in
environment: production

# -- CouchDB configuration
couchdb:
  # -- CouchDB persistent volume configuration
  persistentVolume:
    # -- Enable persistent volume
    enabled: true
    # -- Persistent volume size
    size: 10Gi
    # -- Persistent volume storage class
    storageClass: "your-storage-class"
  # -- CouchDB admin username
  adminUsername: ""
  # -- CouchDB admin password
  adminPassword: ""
  # -- CouchDB cookie auth secret
  cookieAuthSecret: "changeme"
  # -- CouchDB configuration
  couchdbConfig:
    couchdb:
      uuid: "00000000-0000-0000-0000-000000000000"
    databaseConfig:
      feeds:
        partitioned: true
      articles:
        partitioned: true
      events:
        partitioned: true

# -- Moirai configuration
moirai:
  adminUsername: ""
  adminPassword: ""
  jwtSecretKey: ""

# -- OpenAI API key
openai:
  apiKey: ""

# -- Gemini API key
gemini:
  apiKey: ""

# -- Ollama endpoint
ollama:
  endpoint: "https://ollama.example.com"

# -- Service account configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

prometheus:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: prometheus

# -- Open WebUI endpoint
openWebui:
  endpoint: "https://open-webui.example.com"

# -- Redis configuration (used for rate-limiter sync and agent orchestrator locking)
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  # -- Redis password (MUST be overridden in custom-values.yaml)
  password: ""
  # -- Maximum memory Redis may use (keep small on Pi)
  maxmemory: "64mb"
  # -- Eviction policy when maxmemory is reached
  maxmemoryPolicy: "allkeys-lru"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: "100Mi"
    limits:
      cpu: 200m
      memory: 128Mi
      ephemeral-storage: "256Mi"
