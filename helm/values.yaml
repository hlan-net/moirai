# Default values for GenAI Press Review service

replicaCount: 1 # This can be overridden per-service if needed

api:
  replicaCount: 1
  image:
    repository: ghcr.io/hlan-net/moirai
    tag: "latest"
    pullPolicy: Always
  command:
    - /bin/sh
    - -c
    - "uvicorn main:app --host 0.0.0.0 --port 8088 --interface wsgi"
  service:
    type: ClusterIP
    port: 8088
    targetPort: 8088
  enableProdStartup: "true"
  articleExpirationDays: 30

ui:
  replicaCount: 1
  image:
    repository: ghcr.io/hlan-net/moirai-ui
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

nginx:
  replicaCount: 1
  image:
    repository: nginx
    tag: "1.25-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP # Or LoadBalancer/NodePort if you want to expose it directly
    port: 80
    targetPort: 80
  ingress:
    enabled: true
    host: moirai.example.com
    annotations: {}
    tls: []

mcpServer:
  enabled: true
  command:
    - /bin/sh
    - -c
    - "/app/create_dbs.sh && uvicorn mcp_service.main:app --host 0.0.0.0 --port 8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
    metricsPort: 9000
    metricsTargetPort: 9000

# -- Environment to run the application in
environment: production

# -- CouchDB configuration
couchdb:
  # -- CouchDB persistent volume configuration
  persistentVolume:
    # -- Enable persistent volume
    enabled: true
    # -- Persistent volume size
    size: 10Gi
    # -- Persistent volume storage class
    storageClass: "your-storage-class"
  # -- CouchDB admin username
  adminUsername: ""
  # -- CouchDB admin password
  adminPassword: ""
  # -- CouchDB cookie auth secret
  cookieAuthSecret: "changeme"
  # -- CouchDB configuration
  couchdbConfig:
    couchdb:
      uuid: "00000000-0000-0000-0000-000000000000"
    databaseConfig:
      feeds:
        partitioned: true
      articles:
        partitioned: true
      events:
        partitioned: true

# -- Moirai configuration
moirai:
  apiUsername: ""
  apiPassword: ""

# -- OpenAI API key
openai:
  apiKey: ""

# -- Ollama endpoint
ollama:
  endpoint: "https://ollama.example.com"

# -- Service account configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

prometheus:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# -- Open WebUI endpoint
openWebui:
  endpoint: "https://open-webui.example.com"
