# Default values for GenAI Press Review service
replicaCount: 1
image:
  repository: slorba/moirai
  tag: "latest"

ingress:
  host: moirai.example.com 

service:
  name: moirai-service
  port: 80
  targetPort: 8080

app:
  name: moirai-app

deployment:
  name: moirai-deployment
  replicas: 1

environment: production

couchdb:
  name: couchdb
  port: 5984
  image:
    repository: couchdb
    tag: 3.1.1
  persistence:
    enabled: true
    size: 1Gi
  adminUser: "admin"
  adminPassword: "password"

ollama:
  endpoint: "https://ollama.example.com"

openWebui:
  endpoint: "https://open-webui.example.com"

