# Default values for GenAI Press Review service
replicaCount: 1
image:
  repository: slorba/moirai
  tag: "latest"

ingress:
  host: moirai.example.com 

service:
  name: moirai-service
  port: 8088
  targetPort: 8080

app:
  name: moirai-app

deployment:
  name: moirai-deployment
  replicas: 1

dns:
  clusterDomainSuffix: cluster.local

environment: production

couchdb:
  name: couchdb
  replicas: 1 # Renamed from replicaCount
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: "your-storage-class"
  createAdminSecret: true
  adminUsername: "admin"
  adminPassword: "your-password"
  cookieAuthSecret: "your-cookie-secret"
  couchdbConfig:
    couchdb:
      uuid: "00000000-0000-0000-0000-000000000000"
    databaseConfig:
      feeds:
        partitioned: true
      articles:
        partitioned: true
      events:
        partitioned: true

ollama:
  endpoint: "https://ollama.example.com"

openWebui:
  endpoint: "https://open-webui.example.com"

