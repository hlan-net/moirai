# Default values for GenAI Press Review service
replicaCount: 1
image:
  repository: slorba/moirai
  tag: "latest"

ingress:
  host: my-app.example.com

service:
  name: moirai-service
  port: 80
  targetPort: 8080

app:
  name: moirai-app

deployment:
  name: moirai-deployment
  replicas: 3

environment: production

mongodb:
  name: mongodb
  replicas: 1
  image:
    repository: mongo       # Docker's official MongoDB image
    tag: "6.0"              # Adjust the tag as needed
  port: 27017
  persistence:
    storageClass: "standard"  # Name of your storage class (can be adjusted)
    size: "8Gi"               # Desired persistent storage size
  database: mydatabase

ollama:
  endpoint: "https://ollama.example.com"

openWebui:
  endpoint: "https://open-webui.example.com"
