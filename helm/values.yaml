# Default values for GenAI Press Review service

# -- Number of replicas to deploy
replicaCount: 1

# -- Allow public read access to the API
allowPublicRead: false

# -- Image configuration
image:
  # -- Image repository
  repository: ghcr.io/hlan-net/moirai
  # -- Image tag
  tag: "latest"
  # -- Image pull policy
  pullPolicy: Always

# -- Ingress configuration
ingress:
  # -- Enable ingress
  enabled: true
  # -- Ingress host
  host: moirai.example.com
  # -- Ingress annotations
  annotations: {}
  # -- Ingress TLS configuration
  tls: []

# -- Service configuration
service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 8088
  # -- Service target port
  targetPort: 8088

# -- MCP server configuration
mcpServer:
  # -- Enable MCP server
  enabled: true
  # -- MCP server command
  command:
    - python
    - /app/mcp_server.py
  # -- MCP server service configuration
  service:
    # -- MCP server service type
    type: ClusterIP
    # -- MCP server service port
    port: 8090
    # -- MCP server service target port
    targetPort: 8090

# -- Environment to run the application in
environment: production

# -- CouchDB configuration
couchdb:
  # -- CouchDB persistent volume configuration
  persistentVolume:
    # -- Enable persistent volume
    enabled: true
    # -- Persistent volume size
    size: 10Gi
    # -- Persistent volume storage class
    storageClass: "your-storage-class"
  # -- CouchDB admin username
  adminUsername: ""
  # -- CouchDB admin password
  adminPassword: ""
  # -- CouchDB cookie auth secret
  cookieAuthSecret: "changeme"
  # -- CouchDB configuration
  couchdbConfig:
    couchdb:
      uuid: "00000000-0000-0000-0000-000000000000"
    databaseConfig:
      feeds:
        partitioned: true
      articles:
        partitioned: true
      events:
        partitioned: true

# -- Moirai configuration
moirai:
  apiUsername: ""
  apiPassword: ""

# -- OpenAI API key
openai:
  apiKey: ""

# -- Ollama endpoint
ollama:
  endpoint: "https://ollama.example.com"

# -- Service account configuration
serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Open WebUI endpoint
openWebui:
  endpoint: "https://open-webui.example.com"
