# Development environment overrides
# Deploy with: helm install moirai . -f values-dev.yaml -n moirai-dev

# Use :main images (pushed by docker-dev.yml on every push to main branch)
api:
  image:
    tag: "main"

ui:
  image:
    tag: "main"

# Dev-specific settings
environment: development
api:
  replicaCount: 1  # Reduce replicas in dev to save resources
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10

ui:
  replicaCount: 1
