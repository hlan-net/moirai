# Full development environment: Python from conda-forge, packages from
# requirements-dev.txt (the runtime pins in requirements.txt plus dev/test
# tooling). Add or bump a package in those files, not here.
name: moirai
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r requirements-dev.txt
