name: Build and Upload Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'helm/**'
      - '.github/workflows/helm-package.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Helm
        uses: azure/setup-helm@v1

      - name: Set HELM_HOME environment variable
        run: echo "HELM_HOME=$HOME/.helm" >> $GITHUB_ENV

      - name: Build Helm package
        run: helm package helm

      - name: Upload Helm package
        env:
          HELM_REPOSITORY_URL: ${{ vars.HELM_REPOSITORY_URL }}
          HELM_USERNAME: ${{ secrets.HELM_USERNAME }}
          HELM_PASSWORD: ${{ secrets.HELM_PASSWORD }}
        run: |
          helm init
          helm repo add hlan-repo $HELM_REPOSITORY_URL --username $HELM_USERNAME --password $HELM_PASSWORD
          mkdir -p $HELM_HOME/plugins
          helm plugin install https://github.com/chartmuseum/helm-push.git
          helm cm-push moirai-*.tgz hlan-repo
