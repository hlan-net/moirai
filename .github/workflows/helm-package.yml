name: Build and Upload Helm Chart

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Helm
        uses: azure/setup-helm@v1

      - name: Build Helm package
        run: helm package ./path/to/chart

      - name: Upload Helm package
        env:
          HELM_REPOSITORY_URL: ${{ vars.HELM_REPOSITORY_URL }}
          HELM_USERNAME: ${{ secrets.HELM_USERNAME }}
          HELM_PASSWORD: ${{ secrets.HELM_PASSWORD }}
        run: |
          helm repo add my-repo $HELM_REPOSITORY_URL --username $HELM_USERNAME --password $HELM_PASSWORD
          helm push ./path/to/chart-*.tgz my-repo