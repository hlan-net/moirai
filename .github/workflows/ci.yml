name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, release/v0.7.0 ]
  pull_request:
    branches: [ main, release/v0.7.0 ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3.1.1
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        ports:
          - 5984:5984

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Cache Docker layers
      uses: actions/cache@v5
      with:
        path: /tmp/.buildx-cache
        key: buildx-${{ runner.os }}-${{ hashFiles('api/Dockerfile', 'environment.yml', 'environment-prod.yml') }}
        restore-keys: |
          buildx-${{ runner.os }}-

    - name: Set up Miniforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-variant: Miniforge3
        miniforge-version: latest
        environment-file: environment.yml
        activate-environment: moirai
        auto-activate: false
        use-mamba: true
        cache-environment: true
        cache-environment-key: conda-${{ hashFiles('environment.yml') }}

    - name: Install dependencies (Conda)
      # Dependencies are installed by setup-miniconda using environment.yml
      # But we explicitly add missing ones that cause collection issues
      run: |
        conda run -n moirai pip install google-genai==1.3.0 google-auth==2.38.0 tenacity==9.1.4 structlog==25.5.0 passlib==1.7.4
        echo "Conda environment 'moirai' created and activated."
        conda info -e # Display info about environments

    - name: Lint with Ruff
      run: |
        conda run --name moirai ruff check . --target-version=py310

    - name: Run tests
      env:
        COUCHDB_USER: admin
        COUCHDB_PASSWORD: password
        COUCHDB_HOST: localhost
        COUCHDB_PORT: 5984
        ADMIN_USERNAME: testuser
        ADMIN_PASSWORD: testpassword
        FLASK_ENV: test
        TESTING: true
        DISABLE_CSRF: true
      run: |
        conda run --name moirai pytest # Use conda run

    - name: Build API image (cached)
      run: |
        docker buildx build --load \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          -t moirai-app:ci \
          -f api/Dockerfile .
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache
  
  ui-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Cache Docker layers
      uses: actions/cache@v5
      with:
        path: /tmp/.buildx-cache
        key: buildx-${{ runner.os }}-${{ hashFiles('api/Dockerfile', 'environment.yml', 'environment-prod.yml', 'ui/Dockerfile', 'ui/package.json', 'ui/yarn.lock') }}
        restore-keys: |
          buildx-${{ runner.os }}-
    
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'yarn'
        cache-dependency-path: ui/yarn.lock

    - name: Install dependencies (Yarn)
      working-directory: ./ui
      run: yarn install

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('ui/package.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Build UI
      working-directory: ./ui
      run: yarn build

    - name: Install Playwright Browsers
      working-directory: ./ui
      run: npx playwright install --with-deps

    - name: Build service images (cached)
      run: |
        docker buildx build --load \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          -t moirai-app:ci \
          -f api/Dockerfile .
        docker buildx build --load \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          -t moirai-ui:ci \
          -f ui/Dockerfile ui
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Start UI stack (Docker Compose)
      env:
        COUCHDB_PASSWORD: password
        REDIS_PASSWORD: password
        ADMIN_USERNAME: testuser
        ADMIN_PASSWORD: testpassword
        JWT_SECRET_KEY: super_secret_test_key_that_is_at_least_32_chars_long
        DISABLE_CSRF: true
      run: |
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build couchdb redis api ui nginx mcp-server
        for i in {1..30}; do
          if curl -fsS http://localhost:8088/api/health > /dev/null; then
            exit 0
          fi
          sleep 2
        done
        docker compose ps
        exit 1

    - name: Run Playwright tests
      working-directory: ./ui
      env:
        ADMIN_USERNAME: testuser
        ADMIN_PASSWORD: testpassword
      run: |
        npx playwright test

    - name: Wait for MCP server
      run: |
        for i in {1..30}; do
          if curl -fsS http://localhost:8090/health > /dev/null 2>&1; then
            echo "MCP server is ready"
            exit 0
          fi
          sleep 2
        done
        docker compose logs mcp-server
        exit 1
