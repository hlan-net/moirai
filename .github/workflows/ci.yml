name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    branches: [ main, release/** ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      couchdb:
        image: couchdb:3.5.3
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        ports:
          - 5984:5984

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Cache Docker layers
      uses: actions/cache@v6
      with:
        path: /tmp/.buildx-cache
        key: buildx-${{ runner.os }}-${{ hashFiles('api/Dockerfile', 'environment.yml', 'environment-prod.yml', 'requirements*.txt') }}
        restore-keys: |
          buildx-${{ runner.os }}-

    - name: Set up Miniforge
      uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-variant: Miniforge3
        miniforge-version: latest
        environment-file: environment.yml
        activate-environment: moirai
        auto-activate: false
        use-mamba: true
        cache-environment: true
        cache-environment-key: conda-${{ hashFiles('environment.yml', 'requirements*.txt') }}

    - name: Show environment
      # Dependencies come from environment.yml -> requirements-dev.txt alone, so the
      # tests run against the pinned versions. Do not pip install here.
      run: |
        conda info -e
        conda run -n moirai pip freeze | grep -iE "^(google-genai|google-auth)=="

    - name: Lint with Ruff
      run: |
        conda run --name moirai ruff check . --target-version=py312

    - name: Check formatting with Black
      run: |
        conda run --name moirai black --check --diff .

    - name: Run tests
      env:
        COUCHDB_USER: admin
        COUCHDB_PASSWORD: password
        COUCHDB_HOST: localhost
        COUCHDB_PORT: 5984
        ADMIN_USERNAME: testuser
        ADMIN_PASSWORD: testpassword
        FLASK_ENV: test
        TESTING: true
        DISABLE_CSRF: true
      run: |
        conda run --name moirai pytest # Use conda run

    - name: Build API image (cached)
      run: |
        docker buildx build --load \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          -t moirai-app:ci \
          -f api/Dockerfile .
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  ui-test:
    runs-on: ubuntu-latest
    # A stalled apt mirror once held "Install Playwright Browsers" for 40 minutes.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Cache Docker layers
      uses: actions/cache@v6
      with:
        path: /tmp/.buildx-cache
        key: buildx-${{ runner.os }}-${{ hashFiles('api/Dockerfile', 'environment.yml', 'environment-prod.yml', 'requirements*.txt', 'ui/Dockerfile', 'ui/package.json', 'ui/yarn.lock') }}
        restore-keys: |
          buildx-${{ runner.os }}-

    - name: Enable Corepack (Yarn 4)
      # Installed explicitly (pinned, no lifecycle scripts, as in ui/Dockerfile):
      # Node 25+ no longer bundles Corepack, and setup-node's Yarn cache step
      # below needs the Yarn 4 shim to exist before it runs.
      run: npm install -g --ignore-scripts corepack@0.35.0 && corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: ui/.nvmrc
        cache: 'yarn'
        cache-dependency-path: ui/yarn.lock

    - name: Install dependencies (Yarn)
      working-directory: ./ui
      env:
        YARN_ENABLE_SCRIPTS: false
      run: yarn install --immutable

    - name: Check formatting with Prettier
      working-directory: ./ui
      run: yarn prettier --check .

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('ui/package.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Build UI
      working-directory: ./ui
      run: yarn build

    - name: Install Playwright Browsers
      working-directory: ./ui
      env:
        YARN_ENABLE_SCRIPTS: false
      # Chromium is the only project in ui/playwright.config.ts.
      run: yarn playwright install --with-deps chromium

    - name: Build service images (cached)
      run: |
        docker buildx build --load \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          -t moirai-app:ci \
          -f api/Dockerfile .
        docker buildx build --load \
          --cache-from type=local,src=/tmp/.buildx-cache \
          --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
          -t moirai-ui:ci \
          -f ui/Dockerfile ui
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Start UI stack (Docker Compose)
      env:
        COUCHDB_PASSWORD: password
        REDIS_PASSWORD: password
        ADMIN_USERNAME: testuser
        ADMIN_PASSWORD: testpassword
        JWT_SECRET_KEY: super_secret_test_key_that_is_at_least_32_chars_long
        DISABLE_CSRF: true
      run: |
        docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build couchdb redis api ui nginx mcp-server
        for i in {1..30}; do
          if curl -fsS http://localhost:8088/api/health > /dev/null; then
            exit 0
          fi
          sleep 2
        done
        docker compose ps
        exit 1

    - name: Run Playwright tests
      working-directory: ./ui
      env:
        ADMIN_USERNAME: testuser
        ADMIN_PASSWORD: testpassword
      run: |
        yarn playwright test

    - name: Wait for MCP server
      run: |
        for i in {1..30}; do
          if curl -fsS http://localhost:8090/health > /dev/null 2>&1; then
            echo "MCP server is ready"
            exit 0
          fi
          sleep 2
        done
        docker compose logs mcp-server
        exit 1

    - name: Run security API tests against the stack
      # Moved here from the image workflows (#382), which each started this
      # stack again for them. The tests need only pytest and requests, so a
      # venv replaces the conda environment; --noconftest skips
      # tests/conftest.py, which imports the application.
      env:
        ADMIN_USERNAME: testuser
        ADMIN_PASSWORD: testpassword
        # docker-compose.yml starts the API with rate limiting off.
        DISABLE_RATE_LIMIT: true
      run: |
        python3 -m venv /tmp/security-venv
        /tmp/security-venv/bin/pip install --quiet \
          "$(grep '^pytest==' requirements-dev.txt)" \
          "$(grep '^requests==' requirements.txt)"
        /tmp/security-venv/bin/pytest --noconftest -m integration tests/test_security_api.py

  # Development images (:main and :sha-<hash>), built once the tests of this
  # same run have passed. This was the separate "Docker Dev Build" workflow,
  # which repeated the whole test stack before building (#382).
  dev-images:
    needs: [test, ui-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ghcr.io/${{ github.repository }}
            context: .
            file: api/Dockerfile
          - image: ghcr.io/${{ github.repository }}-ui
            context: ui
            file: ui/Dockerfile
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Docker Metadata
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      id: docker_meta
      with:
        images: ${{ matrix.image }}
        tags: |
          type=ref,event=branch
          type=sha

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.file }}
        push: true
        platforms: linux/amd64,linux/arm64
        cache-from: type=registry,ref=${{ matrix.image }}:buildcache
        cache-to: type=registry,ref=${{ matrix.image }}:buildcache,mode=max
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        build-args: |
          APP_VERSION=dev
          BUILD_NUMBER=${{ github.run_number }}
