name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3.1.1
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        ports:
          - 5984:5984

    steps:
    - uses: actions/checkout@v3

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v2
      with:
        miniforge-version: 'latest'
        python-version: '3.10' # Match python version in environment.yml
        environment-file: environment.yml
        auto-activate-base: false # Don't auto-activate base env
        activate-environment: moirai # Activate the created env named 'moirai'

    - name: Install dependencies (Conda)
      # Dependencies are installed by setup-miniconda using environment.yml
      run: |
        echo "Conda environment 'moirai' created and activated."
        conda info -e # Display info about environments

    - name: Lint with Ruff
      run: |
        conda run --name moirai ruff check . --select=E9,F63,F7,F82 --target-version=py310 # Use conda run
        conda run --name moirai ruff check . --exit-zero --statistics # Use conda run

    - name: Run tests
      env:
        COUCHDB_USER: admin
        COUCHDB_PASSWORD: password
        COUCHDB_HOST: localhost
        COUCHDB_PORT: 5984
        API_USERNAME: testuser
        API_PASSWORD: testpassword
        FLASK_ENV: test
        TESTING: true
      run: |
        conda run --name moirai pytest # Use conda run
