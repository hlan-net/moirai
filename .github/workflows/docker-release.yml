name: Docker Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # The tagged commit was tested by CI when it was pushed to main (or to a
  # release/** branch). This job does not test it again (#382): it waits for
  # that CI run and lets the build start only if it succeeded.
  verify-ci:
    name: Verify CI passed for the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for a successful CI run of the push of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag pushed right after the merge finds CI still running, so poll.
          # Only a run for the push of this commit counts, not a pull_request
          # run that happened to test the same SHA.
          for attempt in $(seq 1 120); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --event push --json status,conclusion,url \
              || echo '[]')  # a failed API call is retried on the next round
            if echo "$runs" | jq -e 'any(.[]; .conclusion == "success")' > /dev/null; then
              echo "CI succeeded for $GITHUB_SHA:"
              echo "$runs" | jq -r '.[] | select(.conclusion == "success") | .url'
              exit 0
            fi
            if echo "$runs" | jq -e 'length > 0 and all(.[]; .status == "completed")' > /dev/null; then
              echo "::error::CI did not succeed for $GITHUB_SHA. Re-run it, then re-run this workflow."
              echo "$runs" | jq -r '.[] | "\(.conclusion) \(.url)"'
              exit 1
            fi
            echo "Waiting for CI on $GITHUB_SHA ($attempt/120)"
            sleep 20
          done
          echo "::error::No successful CI run for $GITHUB_SHA within 40 minutes."
          exit 1

  build:
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ghcr.io/${{ github.repository }}
            context: .
            file: api/Dockerfile
          - image: ghcr.io/${{ github.repository }}-ui
            context: ui
            file: ui/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from tag
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Docker Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: docker_meta
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          # Read-only: the cache is written by the dev-images job in ci.yml
          # for the same commit, so the layers before the version build args
          # (the conda environment, yarn install) are reused.
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            BUILD_NUMBER=${{ github.run_number }}
