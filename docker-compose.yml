services:
  moirai:
    build: .
    ports:
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - COUCHDB_URI=http://admin:password@couchdb:5984/
      - HTTP_PORT=8088
      - PYTHONUNBUFFERED=1
      - ITERATION_INTERVAL=300
      - MCP_SERVER_URL=http://mcp-server:8090/sse
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      - OPENAI_API_KEY=sk-ollama
      - MODEL_NAME=llama3.1:latest
      - ALLOW_PUBLIC_READ=true
    depends_on:
      - couchdb
    volumes:
      - ./feeds:/app/feeds

  mcp-server:
    build: .
    command: ["uvicorn", "mcp_server:app", "--host", "0.0.0.0", "--port", "8090"]
    ports:
      - "8090:8090"
    environment:
      - COUCHDB_URI=http://admin:password@couchdb:5984/
      - API_USERNAME=username
      - API_PASSWORD=password
    depends_on:
      - couchdb

  couchdb:
    image: couchdb:3
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      - COUCHDB_SECRET=password
    volumes:
      - couchdb_data:/opt/couchdb/data

volumes:
  couchdb_data:
