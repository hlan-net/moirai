services:
  moirai:
    build: .
    ports:
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - COUCHDB_URI=http://admin:${COUCHDB_PASSWORD:-password}@couchdb:5984/
      - HTTP_PORT=8088
      - PYTHONUNBUFFERED=1
      - ITERATION_INTERVAL=300
      - MCP_SERVER_URL=http://mcp-server:8090/sse
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_USERNAME=${API_USERNAME:-username}
      - API_PASSWORD=${API_PASSWORD:-password}
      - MODEL_NAME=${MODEL_NAME:-llama3.1:latest}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-ollama}
      - ALLOW_PUBLIC_READ=true
      - ARTICLE_EXPIRATION_DAYS=30
      - DISABLE_RATE_LIMIT=true
    depends_on:
      - couchdb
    volumes:
      - ./feeds:/app/feeds

  mcp-server:
    build: .
    command: [ "python", "mcp_server.py" ]
    ports:
      - "8090:8090"
    environment:
      - COUCHDB_URI=http://admin:${COUCHDB_PASSWORD:-password}@couchdb:5984/
      - API_USERNAME=username
      - API_PASSWORD=${API_PASSWORD}
    depends_on:
      - couchdb

  couchdb:
    image: couchdb:3
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-password}
      - COUCHDB_SECRET=${COUCHDB_SECRET:-secret}
    volumes:
      - couchdb_data:/opt/couchdb/data

volumes:
  couchdb_data:
