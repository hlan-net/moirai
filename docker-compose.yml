services:
  api:
    build: .
    command: [ "/opt/conda/envs/moirai/bin/gunicorn", "--config", "gunicorn.conf.py", "main:app" ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - COUCHDB_URI=http://admin:${COUCHDB_PASSWORD:?COUCHDB_PASSWORD must be set}@couchdb:5984/
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?COUCHDB_PASSWORD must be set}
      - HTTP_PORT=8088
      - PYTHONUNBUFFERED=1
      - ITERATION_INTERVAL=300
      - MCP_SERVER_URL=http://mcp-server:8090/sse
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_USERNAME=${API_USERNAME:-username}
      - API_PASSWORD=${API_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super_secret_test_key_that_is_at_least_32_chars_long}
      - MODEL_NAME=${MODEL_NAME:-gemini-3-flash}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-ollama}
      - ALLOW_PUBLIC_READ=true
      - ARTICLE_EXPIRATION_DAYS=30
      - DISABLE_RATE_LIMIT=true
      - ENABLE_PROD_STARTUP=true
      - GUNICORN_CMD_ARGS="--preload"
    depends_on:
      - couchdb
    volumes:
      - ./:/app
      - ./feeds:/app/feeds
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ui:
    build:
      context: ./ui

  nginx:
    image: nginx:latest
    ports:
      - "8088:80"
    volumes:
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ui/dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_started

  mcp-server:
    build: .
    command: [ "sh", "-c", "/app/create_dbs.sh && conda run --name moirai uvicorn mcp_service.main:app --host $${HTTP_HOST:-0.0.0.0} --port 8090" ]
    ports:
      - "8090:8090"
    environment:
      - COUCHDB_URI=http://admin:${COUCHDB_PASSWORD:?COUCHDB_PASSWORD must be set}@couchdb:5984/
      - API_USERNAME=username
      - API_PASSWORD=${API_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super_secret_test_key_that_is_at_least_32_chars_long}
      - COUCHDB_USER=admin # Explicitly set COUCHDB_USER for create_dbs.sh
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?COUCHDB_PASSWORD must be set} # Explicitly set COUCHDB_PASSWORD for create_dbs.sh
      - REDIS_HOST=redis # Added Redis host
      - REDIS_PORT=6379 # Added Redis port
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set} # Added Redis password
    depends_on:
      - couchdb
      - redis # Added dependency on redis

  couchdb:
    image: couchdb:3
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:?COUCHDB_PASSWORD must be set}
      - COUCHDB_SECRET=${COUCHDB_SECRET:-secret}
    volumes:
      - couchdb_data:/opt/couchdb/data

  redis: # Added Redis service
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"] # Use mandatory password
    volumes:
      - redis_data:/data # Persistent data for Redis

volumes:
  couchdb_data:
  redis_data: # Added Redis data volume