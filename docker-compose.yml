services:
  moirai:
    build: .
    ports:
      - "8088:8088"
    environment:
      - COUCHDB_URI=http://admin:password@couchdb:5984/
      - HTTP_PORT=8088
      - PYTHONUNBUFFERED=1
      - ITERATION_INTERVAL=300
    depends_on:
      - couchdb
    volumes:
      - ./feeds:/app/feeds

  mcp-server:
    build: .
    command: ["python", "mcp_server.py"]
    ports:
      - "8090:8090"
    environment:
      - COUCHDB_URI=http://admin:password@couchdb:5984/
    depends_on:
      - couchdb

  couchdb:
    image: couchdb:3
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
      - COUCHDB_SECRET=password
    volumes:
      - couchdb_data:/opt/couchdb/data

volumes:
  couchdb_data:
