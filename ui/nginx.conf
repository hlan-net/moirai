server {
    listen 80;
    server_name localhost;

    # Root directory for the Vue.js built files
    root /usr/share/nginx/html;
    index index.html;

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend API service
    location /api {
        proxy_pass http://api:8088; # Assumes your API service is named 'api' and runs on 8088
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Handle WebSocket connections for development server if needed
    # location /sockjs-node {
    #     proxy_pass http://<your_dev_server_ip>:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "Upgrade";
    # }
}
